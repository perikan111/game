<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDGE VLM・作業手順の時系列検出</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0d;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .page {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 24px 40px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .badge-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #f5a524;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.3;
  }
  .timer {
    font-size: 28px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #f5a524;
    background: rgba(245, 165, 36, 0.1);
    border: 1px solid rgba(245, 165, 36, 0.3);
    border-radius: 10px;
    padding: 8px 18px;
    white-space: nowrap;
  }
  .main {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 20px;
  }
  @media (max-width: 860px) {
    .main { grid-template-columns: 1fr; }
  }
  .panel {
    background: #131318;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    overflow: hidden;
  }
  .video-wrap {
    position: relative;
    background: #000;
    aspect-ratio: 16 / 9;
  }
  .video-wrap video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    cursor: pointer;
  }
  .detecting-badge {
    position: absolute;
    top: 14px;
    left: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(225, 29, 72, 0.85);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 5px 12px;
    border-radius: 20px;
    z-index: 2;
  }
  .detecting-badge .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #fff;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .play-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.35);
    cursor: pointer;
    z-index: 3;
    transition: opacity 0.2s;
  }
  .play-overlay.hidden { display: none; }
  .play-overlay .btn {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.6);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .play-overlay .btn::after {
    content: '';
    border-style: solid;
    border-width: 14px 0 14px 22px;
    border-color: transparent transparent transparent #fff;
    margin-left: 6px;
  }
  .vlm-output {
    padding: 20px 24px 24px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .vlm-label {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .vlm-caption {
    font-size: 21px;
    font-weight: 700;
    min-height: 30px;
    margin-bottom: 18px;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.55);
    background: transparent;
    transition: all 0.2s;
    font-weight: 600;
  }
  .chip.active {
    border-color: transparent;
    color: #0a0a0d;
  }
  .right-panel {
    padding: 22px 22px 10px;
  }
  .right-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .right-header h2 {
    font-size: 18px;
    font-weight: 700;
  }
  .right-header .count {
    font-size: 18px;
    font-weight: 800;
    color: #f5a524;
  }
  .right-note {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 18px;
    line-height: 1.5;
  }
  .check-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 0;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .checkbox {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 2px solid rgba(255,255,255,0.25);
    flex-shrink: 0;
    margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: 900;
    color: transparent;
    transition: all 0.25s;
  }
  .checkbox.checked {
    border-color: transparent;
    color: #0a0a0d;
  }
  .check-body { flex: 1; }
  .check-title {
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .check-title .low-conf {
    font-size: 11px;
    font-weight: 700;
    color: #f5a524;
    opacity: 0.85;
  }
  .check-sub {
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    margin-top: 3px;
  }
  .check-time {
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    margin-top: 2px;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .check-time.show { opacity: 1; }
  .timeline {
    margin-top: 24px;
    padding: 4px 6px 0;
  }
  .timeline-track {
    position: relative;
    height: 6px;
    background: rgba(255,255,255,0.12);
    border-radius: 3px;
    cursor: pointer;
  }
  .timeline-fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    background: linear-gradient(90deg, #f5a524, #ff7a45);
    border-radius: 3px;
    width: 0%;
  }
  .timeline-dot {
    position: absolute;
    top: 50%;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 2px solid #0a0a0d;
    transform: translate(-50%, -50%);
    transition: background 0.25s;
  }
  .timeline-dot.reached { background: var(--dot-color, #f5a524); }
  .timeline-playhead {
    position: absolute;
    top: 50%;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #f5a524;
    border: 2px solid #0a0a0d;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 4px rgba(245,165,36,0.25);
  }
  .timeline-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    margin-top: 8px;
  }
  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <div class="badge-label">EDGE VLM・作業手順の時系列検出</div>
      <h1>正解を渡さず、AIが動画から点検手順を検出する</h1>
    </div>
    <div class="timer" id="timer">00.0s</div>
  </header>

  <div class="main">
    <div class="panel">
      <div class="video-wrap" id="videoWrap">
        <div class="detecting-badge"><span class="dot"></span>DETECTING</div>
        <video id="video" playsinline muted loop>
          <source src="assets/edge-vlm-demo.webm" type="video/webm">
          <source src="assets/edge-vlm-demo.mp4" type="video/mp4">
        </video>
        <div class="play-overlay" id="playOverlay"><div class="btn"></div></div>
      </div>
      <div class="vlm-output">
        <div class="vlm-label">VLM 出力 — いま検出していること</div>
        <div class="vlm-caption" id="caption">「コンロの上部を確認（待機）」</div>
        <div class="chips" id="chips"></div>
      </div>
    </div>

    <div class="panel right-panel">
      <div class="right-header">
        <h2>手順書（正解）</h2>
        <span class="count" id="count">0/5</span>
      </div>
      <div class="right-note">※ この手順書はモデルに渡していない。検出結果で自動チェック。</div>
      <div id="checklist"></div>
    </div>
  </div>

  <div class="timeline">
    <div class="timeline-track" id="track">
      <div class="timeline-fill" id="fill"></div>
      <div class="timeline-playhead" id="playhead" style="left:0%"></div>
    </div>
    <div class="timeline-labels">
      <span>0s</span>
      <span id="durationLabel">--s</span>
    </div>
  </div>

  <footer>3D マインスイーパーは <a href="https://github.com/perikan111/game/commit/bb39a91" style="color:rgba(255,255,255,0.5)">コミット履歴</a> からご覧いただけます。</footer>
</div>

<script>
  const CHIP_DEFS = [
    { key: 'つまみ操作', color: '#f5a524' },
    { key: '炎',       color: '#f5a524' },
    { key: '指差し',   color: '#2dd4bf' },
    { key: 'グリル開', color: '#4f8dfd' },
    { key: '電池',     color: '#a78bfa' },
  ];

  const CAPTION_EVENTS = [
    { t: 0.0,  text: 'コンロの上部を確認（待機）',               tags: [] },
    { t: 1.2,  text: '手がつまみを回している',                     tags: ['つまみ操作'] },
    { t: 2.5,  text: '手がつまみを操作している',                   tags: ['つまみ操作'] },
    { t: 3.4,  text: '手がつまみを回している — 炎を確認',          tags: ['つまみ操作', '炎'] },
    { t: 4.3,  text: '手がつまみを操作している（戻す）',           tags: ['つまみ操作'] },
    { t: 5.3,  text: '手がつまみを操作している（指差し）',         tags: ['つまみ操作', '指差し'] },
    { t: 6.3,  text: '手がコンロのつまみに近づいている（指差し）', tags: ['指差し'] },
    { t: 7.3,  text: '手が下部の引き出しを開けている',             tags: ['グリル開'] },
    { t: 8.3,  text: '手がグリルの引き出しを閉める',               tags: ['グリル開'] },
    { t: 9.3,  text: '手がコンロの下部に近づいている',             tags: [] },
    { t: 10.3, text: '手が下部の引き出しを操作している（指差し）', tags: ['指差し'] },
    { t: 11.3, text: '手が下部の引き出しを開けている',             tags: ['グリル開'] },
    { t: 12.3, text: '手が電池ケースを指差している',               tags: ['指差し', '電池'] },
    { t: 13.3, text: '手が魚焼きグリルの引き出しを開けている',     tags: ['グリル開'] },
    { t: 14.3, text: '手がコンロ下部の開口部に差し込まれている',   tags: [] },
  ];

  const CHECKLIST = [
    { t: 3.0,  title: '点火確認',         sub: 'つまみを回して点火→消火',       color: '#f5a524', lowConf: false },
    { t: 5.0,  title: '指差し確認①',     sub: '点火の結果を指差し呼称',         color: '#2dd4bf', lowConf: false },
    { t: 7.0,  title: 'グリル開閉',       sub: '魚焼きグリルを開けて閉じる',     color: '#4f8dfd', lowConf: false },
    { t: 10.0, title: '指差し確認②',     sub: 'グリルの状態を指差し呼称',       color: '#2dd4bf', lowConf: true },
    { t: 12.0, title: '電池確認',         sub: '点火用電池が入っているか',       color: '#a78bfa', lowConf: false },
  ];

  const video = document.getElementById('video');
  const playOverlay = document.getElementById('playOverlay');
  const videoWrap = document.getElementById('videoWrap');
  const timer = document.getElementById('timer');
  const caption = document.getElementById('caption');
  const chipsEl = document.getElementById('chips');
  const countEl = document.getElementById('count');
  const checklistEl = document.getElementById('checklist');
  const fill = document.getElementById('fill');
  const playhead = document.getElementById('playhead');
  const track = document.getElementById('track');
  const durationLabel = document.getElementById('durationLabel');

  chipsEl.innerHTML = CHIP_DEFS.map(c => `<span class="chip" data-key="${c.key}">${c.key}</span>`).join('');

  checklistEl.innerHTML = CHECKLIST.map((item, i) => `
    <div class="check-item" data-index="${i}">
      <div class="checkbox" style="--c: ${item.color}">✓</div>
      <div class="check-body">
        <div class="check-title">${item.title}${item.lowConf ? '<span class="low-conf">△低信頼</span>' : ''}</div>
        <div class="check-sub">${item.sub}</div>
      </div>
      <div class="check-time" style="color:${item.color}">検出 t=${item.t.toFixed(1)}s</div>
    </div>
  `).join('');

  function formatTime(t) {
    const s = Math.max(0, t).toFixed(1);
    const [intPart, decPart] = s.split('.');
    return intPart.padStart(2, '0') + '.' + decPart + 's';
  }

  function render() {
    const t = video.currentTime;
    timer.textContent = formatTime(t);

    let current = CAPTION_EVENTS[0];
    for (const ev of CAPTION_EVENTS) {
      if (ev.t <= t) current = ev; else break;
    }
    caption.textContent = `「${current.text}」`;
    chipsEl.querySelectorAll('.chip').forEach(chip => {
      const active = current.tags.includes(chip.dataset.key);
      chip.classList.toggle('active', active);
      if (active) {
        const def = CHIP_DEFS.find(c => c.key === chip.dataset.key);
        chip.style.background = def.color;
      } else {
        chip.style.background = 'transparent';
      }
    });

    let doneCount = 0;
    checklistEl.querySelectorAll('.check-item').forEach((el, i) => {
      const item = CHECKLIST[i];
      const done = t >= item.t;
      if (done) doneCount++;
      const box = el.querySelector('.checkbox');
      box.classList.toggle('checked', done);
      box.style.background = done ? item.color : 'transparent';
      box.style.borderColor = done ? item.color : 'rgba(255,255,255,0.25)';
      el.querySelector('.check-time').classList.toggle('show', done);
    });
    countEl.textContent = `${doneCount}/${CHECKLIST.length}`;

    const dur = video.duration || 15.3;
    const pct = Math.min(100, (t / dur) * 100);
    fill.style.width = pct + '%';
    playhead.style.left = pct + '%';
  }

  video.addEventListener('timeupdate', render);
  video.addEventListener('loadedmetadata', () => {
    durationLabel.textContent = formatTime(video.duration);
    renderDots();
    render();
  });

  function renderDots() {
    const dur = video.duration || 15.3;
    document.querySelectorAll('.timeline-dot').forEach(d => d.remove());
    CHECKLIST.forEach(item => {
      const dot = document.createElement('div');
      dot.className = 'timeline-dot';
      dot.style.left = (item.t / dur * 100) + '%';
      dot.style.setProperty('--dot-color', item.color);
      dot.dataset.t = item.t;
      track.appendChild(dot);
    });
  }

  function updateDotStates() {
    const t = video.currentTime;
    track.querySelectorAll('.timeline-dot').forEach(dot => {
      dot.classList.toggle('reached', t >= parseFloat(dot.dataset.t));
    });
  }
  video.addEventListener('timeupdate', updateDotStates);

  function togglePlay() {
    if (video.paused) {
      video.play();
      playOverlay.classList.add('hidden');
    } else {
      video.pause();
      playOverlay.classList.remove('hidden');
    }
  }
  playOverlay.addEventListener('click', togglePlay);
  video.addEventListener('click', togglePlay);
  video.addEventListener('play', () => playOverlay.classList.add('hidden'));
  video.addEventListener('pause', () => playOverlay.classList.remove('hidden'));

  track.addEventListener('click', (e) => {
    const rect = track.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    video.currentTime = ratio * (video.duration || 15.3);
    render();
  });

  render();
</script>
</body>
</html>
